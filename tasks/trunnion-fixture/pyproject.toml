[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-trunnion-fixture"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_trunnion = "trunnion_fixture.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["trunnion_fixture*"]
