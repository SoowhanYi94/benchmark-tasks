[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-tig-seam"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_tig = "tig_seam.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["tig_seam*"]
